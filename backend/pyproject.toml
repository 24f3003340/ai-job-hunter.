[project]
name = "ai-job-hunter-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "pydantic-settings>=2.4",
  "argon2-cffi>=23", "email-validator>=2", "python-multipart>=0.0.9", "psycopg[binary]>=3.2",
  "alembic>=1.13", "pypdf>=5", "python-docx>=1.1", "reportlab>=4", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
