# CI/local-smoke OVERRIDE for docker-compose.staging.yml: adds a TLS SMTP sink, bind-mounts state under ./.ci so the
# host can read mail and back up uploads, and publishes PostgreSQL on loopback for the backup/restore verification.
#   docker compose -f deploy/docker-compose.staging.yml -f deploy/docker-compose.ci.yml --env-file deploy/.env.staging up -d --build
services:
  smtp:
    build: {context: .., dockerfile: deploy/Dockerfile.smtpsink}
    volumes: ["../.ci/mail:/mail", "../.ci/certs:/certs"]
  backend:
    volumes:
      - "../.ci/uploads:/var/lib/jobhunter/storage"
      - "../.ci/certs:/certs:ro"
    depends_on:
      smtp: {condition: service_started}
  postgres:
    ports: ["127.0.0.1:5432:5432"]
