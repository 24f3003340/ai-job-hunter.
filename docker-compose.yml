# Local services for integration tests and development. NOT validated in this repo's sandbox (no Docker daemon
# was available); the same services were run as native processes instead - see docs/REPORT.md.
# Credentials below are throwaway local-development values, not secrets.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: jobhunter_test
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter_test"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  mailpit:            # local SMTP sink + web UI (http://localhost:8025) for manual delivery checks
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
  clamav:             # optional: only for the opt-in `external` ClamAV tests (first start downloads signatures)
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    profiles: ["clamav"]
